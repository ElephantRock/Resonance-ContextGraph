name: ContextGraph CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Enforce architectural independence
        run: |
          if grep -R --line-number --fixed-strings "resonance_world" src; then
            echo "Standalone ContextGraph source must not import or reference resonance_world"
            exit 1
          fi
      - run: ruff check src tests
      - run: pytest -q
